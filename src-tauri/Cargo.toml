[package]
name = "gestor-comunidades"
version = "0.1.1"
description = "Gestor de Comunidades: software para administradores de fincas"
authors = ["Luca Nizzardo"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
